name: Check pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test test/*.test.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_NEWSLETTER_ACTION: ${{ vars.NEXT_PUBLIC_NEWSLETTER_ACTION }}
      - run: python3 scripts/check-live-routes.py
