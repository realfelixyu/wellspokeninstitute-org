name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.INSTITUTE_HOSTING != 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test test/*.test.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_NEWSLETTER_ACTION: ${{ vars.NEXT_PUBLIC_NEWSLETTER_ACTION }}
      # Fail closed: never deploy a build that drops a URL the live sitemap already lists.
      - run: python3 scripts/check-live-routes.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Tell Bing and other IndexNow engines about pages that went live today, including scheduled ones.
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sleep 60
      - run: node scripts/indexnow.mjs --since "$(date -u -d '1 day ago' +%F)"


  refresh-cloudflare:
    if: vars.INSTITUTE_HOSTING == 'cloudflare' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Rebuild the Cloudflare Pages production branch
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [[ "$DEPLOY_HOOK" != https://api.cloudflare.com/* ]]; then
            echo "Configure the production Pages deploy hook in repository secrets."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 --request POST --output /dev/null "$DEPLOY_HOOK"
